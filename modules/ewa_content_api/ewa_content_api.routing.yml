# Campus & Facilities (Media Center items tagged with taxonomy term 12), by language:
#   GET /api/media/campus/en   GET /api/media/campus/ar
ewa_content_api.campus:
  path: '/api/media/campus/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaCenterApiController::category'
    tid: '12'
  requirements:
    _permission: 'access content'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Same output for any Media Center category (taxonomy term id):
#   GET /api/media/category/12/en
ewa_content_api.category:
  path: '/api/media/category/{tid}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaCenterApiController::category'
  requirements:
    _permission: 'access content'
    tid: '\d+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# One Media Center post by category slug + post slug, by language:
#   GET /api/media/post/events/renewable-energy-innovation-summit/en
ewa_content_api.media_post:
  path: '/api/media/post/{category}/{slug}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaPostApiController::post'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9-]+'
    slug: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Media Center category page sections ({category} = events, news-articles, … or "all"):
#   section 1  GET /api/media/featured/events/en?limit=3   featured posts, newest first
#   section 2  GET /api/media/latest/events/en?limit=3     events: upcoming (soonest first) / others: latest
#   section 3  GET /api/media/posts/events/en              all posts, newest first
# Events are dated by their Date field, all other categories by their publishing date.
ewa_content_api.media_posts:
  path: '/api/media/posts/{category}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaPostApiController::posts'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

ewa_content_api.media_featured:
  path: '/api/media/featured/{category}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaPostApiController::featured'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

ewa_content_api.media_latest:
  path: '/api/media/latest/{category}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\MediaPostApiController::latest'
  requirements:
    _permission: 'access content'
    category: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Careers (content type "careers") for the Join page carousel, by language, newest first:
#   GET /api/careers/en   GET /api/careers/ar?limit=5
ewa_content_api.careers:
  path: '/api/careers/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\CareersApiController::list'
  requirements:
    _permission: 'access content'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# One career by slug (from its English Main Title), by language — for /career/[slug]:
#   GET /api/career/it-manager/en   GET /api/career/it-manager/ar
ewa_content_api.career:
  path: '/api/career/{slug}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\CareersApiController::career'
  requirements:
    _permission: 'access content'
    slug: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Awards (content type "awards") for the Awards page, by language, by date newest first:
#   GET /api/awards/en   GET /api/awards/ar
ewa_content_api.awards:
  path: '/api/awards/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\AwardsApiController::list'
  requirements:
    _permission: 'access content'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Team members (content type "team") for /team/[slug], by language:
#   GET /api/team/en                       every member
#   GET /api/team/thamer-al-sharhan/en     one member (slug from the English name)
ewa_content_api.team_list:
  path: '/api/team/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\TeamApiController::list'
  requirements:
    _permission: 'access content'
    langcode: '[a-z]{2,3}'
  methods: [GET]

ewa_content_api.team_member:
  path: '/api/team/{slug}/{langcode}'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\TeamApiController::career'
  requirements:
    _permission: 'access content'
    slug: '[a-z0-9-]+'
    langcode: '[a-z]{2,3}'
  methods: [GET]

# Sign-in for the Next.js site (called by the Next.js server, not by browsers):
#   POST /api/auth/login   { identifier: username or e-mail, password }  → user + Drupal session cookie
#   GET  /api/auth/me      current user (send the session cookie), 401 when signed out
ewa_content_api.auth_login:
  path: '/api/auth/login'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\AuthApiController::login'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

ewa_content_api.auth_me:
  path: '/api/auth/me'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\AuthApiController::me'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [GET]

# Password reset for the Next.js site (called by the Next.js server):
#   POST /api/auth/password/forgot  { identifier, lang }        → e-mails a one-time link
#   POST /api/auth/password/reset   { uid, ts, hash, password } → sets the new password
ewa_content_api.password_forgot:
  path: '/api/auth/password/forgot'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\PasswordApiController::forgot'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

ewa_content_api.password_reset:
  path: '/api/auth/password/reset'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\PasswordApiController::reset'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

# Trainee registration from the Next.js form (called by the Next.js server):
#   POST /api/auth/register  { registration fields, password, courses, lang }
ewa_content_api.auth_register:
  path: '/api/auth/register'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\RegisterApiController::register'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]

# The signed-in trainee updates their own details (Next.js My Profile; send the session cookie):
#   POST /api/auth/profile  { firstName, mobile, … }
ewa_content_api.auth_profile:
  path: '/api/auth/profile'
  defaults:
    _controller: '\Drupal\ewa_content_api\Controller\ProfileApiController::update'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
  methods: [POST]
